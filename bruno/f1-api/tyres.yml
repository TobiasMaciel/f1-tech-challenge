info:
  name: Neumáticos
  type: http
  seq: 6

http:
  method: GET
  url: "{{f1ApiUrl}}/api/tyres"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data.tyres
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Los cinco compuestos con ritmo, degradación y banda de lluvia óptima.
