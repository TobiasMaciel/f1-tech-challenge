info:
  name: Circuitos
  type: http
  seq: 5

http:
  method: GET
  url: "{{f1ApiUrl}}/api/circuits"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data.circuits
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Todos los circuitos.
