info:
  name: Parámetros de simulación
  type: http
  seq: 4

http:
  method: GET
  url: "{{f1ApiUrl}}/api/races/:raceId/simulation-parameters"
  params:
    - name: raceId
      value: race-01
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data.minimumPitStops
      operator: gte
      value: "0"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Pérdida en boxes, efecto del combustible, paradas mínimas, safety car y varianza.
