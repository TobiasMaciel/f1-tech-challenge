info:
  name: Clima de la carrera
  type: http
  seq: 3

http:
  method: GET
  url: "{{f1ApiUrl}}/api/races/:raceId/weather"
  params:
    - name: raceId
      value: race-01
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data.forecast
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Resumen y pronóstico en tramos de vueltas (`forecast`).
