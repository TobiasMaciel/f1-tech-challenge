info:
  name: Pilotos
  type: http
  seq: 7

http:
  method: GET
  url: "{{f1ApiUrl}}/api/drivers"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data.drivers
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Pilotos con ritmo, consistencia y `teamId`.
