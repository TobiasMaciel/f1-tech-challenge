info:
  name: Listar pilotos
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/drivers"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.drivers
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Pilotos con su equipo.

  API F1 original: `GET /api/drivers` + `GET /api/teams`, unidos por `teamId`.
