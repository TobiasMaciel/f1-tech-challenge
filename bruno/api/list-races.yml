info:
  name: Listar carreras
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/races"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.races
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Carreras para el selector, cada una con su circuito.

  API F1 original: `GET /api/races` + `GET /api/circuits`, unidos por `circuitId`.
