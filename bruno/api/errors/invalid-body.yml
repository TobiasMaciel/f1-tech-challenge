info:
  name: Body inválido
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/simulations"
  body:
    type: json
    data: |-
      {
        "raceId": "race-01",
        "driverId": "driver-01",
        "stints": [{ "compound": "ULTRASOFT", "laps": 1.5 }]
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.error.code
      operator: eq
      value: "VALIDATION_ERROR"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  El body no cumple el esquema (compuesto desconocido, vueltas no enteras). `details` lista cada problema.
