info:
  name: Detalle de carrera
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/races/:raceId"
  params:
    - name: raceId
      value: race-01
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.race.id
      operator: eq
      value: "race-01"
    - expression: res.body.tyres
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Carrera con circuito, clima, parámetros de simulación y neumáticos.

  API F1 original: `GET /api/races/:raceId` + `/weather` + `/simulation-parameters` + `GET /api/tyres`, en paralelo.
