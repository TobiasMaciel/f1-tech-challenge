info:
  name: Estado del servicio
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/health"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.status
      operator: eq
      value: "ok"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Responde `{ "status": "ok" }`. No llama a la API F1 original.
